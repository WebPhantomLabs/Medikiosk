services:
  frontend:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on: [backend]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
